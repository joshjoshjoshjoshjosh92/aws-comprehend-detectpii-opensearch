AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Amazon Comprehend + OpenSearch PII Detection - One-Click Deployment
  Deploys OpenSearch domain, EC2 processor instance, IAM roles, and networking.

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: EC2 instance type for the PII processor

  OpenSearchInstanceType:
    Type: String
    Default: t3.small.search
    AllowedValues: [t3.small.search, t3.medium.search, m5.large.search]
    Description: OpenSearch instance type

  OpenSearchVolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 100
    Description: EBS volume size (GB) for OpenSearch

  KeyPairName:
    Type: String
    Default: ''
    Description: (Optional) EC2 key pair for SSH access. Leave blank for SSM-only access.

  DeploymentMode:
    Type: String
    Default: ec2
    AllowedValues: [ec2, serverless]
    Description: "ec2 = always-on processor. serverless = Lambda + EventBridge (scales to zero cost)."

  ScanSchedule:
    Type: String
    Default: rate(5 minutes)
    Description: (Serverless mode) How often to scan for unscanned docs. Use 'rate(N minutes)' or cron.

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, '']]
  IsEC2Mode: !Equals [!Ref DeploymentMode, 'ec2']
  IsServerlessMode: !Equals [!Ref DeploymentMode, 'serverless']

Resources:

  # ─── Networking ───────────────────────────────────────────────────────────────

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: pii-detect-vpc

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: pii-detect-private-subnet

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: pii-detect-public-subnet

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ─── Security Groups ─────────────────────────────────────────────────────────

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PII Detect EC2 instance
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for Comprehend API, OpenSearch, pip, SSM

  OpenSearchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PII Detect OpenSearch domain
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref EC2SecurityGroup

  # ─── IAM ─────────────────────────────────────────────────────────────────────

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pii-detect-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: pii-detect-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ComprehendReadOnly
                Effect: Allow
                Action:
                  - comprehend:DetectPiiEntities
                  - comprehend:ContainsPiiEntities
                Resource: '*'
              - Sid: OpenSearchWrite
                Effect: Allow
                Action:
                  - es:ESHttpPost
                  - es:ESHttpPut
                  - es:ESHttpGet
                Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/pii-detect-domain/*'
              - Sid: AuditLogging
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuditLogGroup.Arn

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ─── OpenSearch ──────────────────────────────────────────────────────────────

  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: pii-detect-domain
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: !Ref OpenSearchInstanceType
        InstanceCount: 1
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: !Ref OpenSearchVolumeSize
      VPCOptions:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref OpenSearchSecurityGroup
      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt EC2Role.Arn
            Action:
              - 'es:ESHttpPost'
              - 'es:ESHttpPut'
              - 'es:ESHttpGet'
            Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/pii-detect-domain/*'
      NodeToNodeEncryptionOptions:
        Enabled: true
      EncryptionAtRestOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07

  # ─── Logging ─────────────────────────────────────────────────────────────────

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /pii-detect/vpc-flow-logs
      RetentionInDays: 30

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /pii-detect/audit
      RetentionInDays: 90

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flow-log-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: '*'

  # ─── EC2 Instance ────────────────────────────────────────────────────────────

  EC2Instance:
    Type: AWS::EC2::Instance
    Condition: IsEC2Mode
    DependsOn: OpenSearchDomain
    Properties:
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      Tags:
        - Key: Name
          Value: pii-detect-processor
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Install dependencies
          dnf install -y python3-pip git
          pip3 install boto3 opensearch-py requests-aws4auth python-dotenv

          # Clone the repo
          cd /home/ec2-user
          git clone https://github.com/joshjoshjoshjoshjosh92/aws-comprehend-detectpii-opensearch.git pii-detect
          cd pii-detect

          # Write .env with the OpenSearch endpoint
          echo "OPENSEARCH_ENDPOINT=${OpenSearchDomain.DomainEndpoint}" > .env
          echo "AWS_REGION=${AWS::Region}" >> .env

          chown -R ec2-user:ec2-user /home/ec2-user/pii-detect

          # Signal ready
          echo "PII Detect setup complete" > /home/ec2-user/setup-complete.txt

  # ─── Serverless (Lambda + EventBridge) ────────────────────────────────────

  LambdaRole:
    Type: AWS::IAM::Role
    Condition: IsServerlessMode
    Properties:
      RoleName: pii-detect-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: pii-detect-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ComprehendReadOnly
                Effect: Allow
                Action:
                  - comprehend:DetectPiiEntities
                  - comprehend:ContainsPiiEntities
                Resource: '*'
              - Sid: OpenSearchWrite
                Effect: Allow
                Action:
                  - es:ESHttpPost
                  - es:ESHttpPut
                  - es:ESHttpGet
                Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/pii-detect-domain/*'
              - Sid: S3Read
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: '*'
              - Sid: Logging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsServerlessMode
    Properties:
      GroupDescription: PII Detect Lambda
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for Comprehend and OpenSearch

  LambdaIngressToOpenSearch:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsServerlessMode
    Properties:
      GroupId: !Ref OpenSearchSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  PiiDetectFunction:
    Type: AWS::Lambda::Function
    Condition: IsServerlessMode
    Properties:
      FunctionName: pii-detect-processor
      Runtime: python3.12
      Handler: handler.handler
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt LambdaRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt OpenSearchDomain.DomainEndpoint
          OPENSEARCH_INDEX: pii-test
          PII_HANDLING_MODE: REDACT
          PII_CONFIDENCE_THRESHOLD: '0.7'
          SCAN_BATCH_SIZE: '25'
      Code:
        ZipFile: |
          # Deploy lambda/handler.py via CI/CD or S3 upload
          def handler(event, context):
              return {"status": "replace with lambda/handler.py"}

  ScanScheduleRule:
    Type: AWS::Events::Rule
    Condition: IsServerlessMode
    Properties:
      Name: pii-detect-scan-schedule
      ScheduleExpression: !Ref ScanSchedule
      State: ENABLED
      Targets:
        - Id: pii-detect-lambda
          Arn: !GetAtt PiiDetectFunction.Arn
          Input: '{"detail-type": "Scheduled Event", "source": "aws.events"}'

  ScanSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: IsServerlessMode
    Properties:
      FunctionName: !Ref PiiDetectFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScanScheduleRule.Arn

Outputs:
  OpenSearchEndpoint:
    Description: OpenSearch domain endpoint (VPC)
    Value: !GetAtt OpenSearchDomain.DomainEndpoint

  EC2InstanceId:
    Condition: IsEC2Mode
    Description: EC2 instance ID (connect via SSM Session Manager)
    Value: !Ref EC2Instance

  SSMConnectCommand:
    Condition: IsEC2Mode
    Description: Command to connect to the EC2 instance
    Value: !Sub 'aws ssm start-session --target ${EC2Instance} --region ${AWS::Region}'

  LambdaFunctionArn:
    Condition: IsServerlessMode
    Description: Lambda function ARN for PII detection
    Value: !GetAtt PiiDetectFunction.Arn

  RunDemoCommand:
    Condition: IsEC2Mode
    Description: Run this after connecting via SSM
    Value: 'cd /home/ec2-user/pii-detect && python3 run_demo.py'
